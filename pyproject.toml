[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-showdown"
version = "0.1.0"
description = "Pokemon Showdown Jev Agent for autonomous Gen 9 Random Battles"
authors = [{ name = "Jev Showdown Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "poke-env>=0.16.1,<0.17",
    "httpx>=0.27.0,<0.28",
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0,<0.142",
    "uvicorn[standard]>=0.22.0,<0.54",
    "websockets>=11.0,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

# Make the src-layout package importable when running pytest from the repo root
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
